<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body{
            min-height: 100%;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-image: url(bg.jpeg);
            background-size: 110% 110%;
            background-position: center;
            background-attachment: fixed;
        }
        .filler{
            z-index: -5;
            position: fixed;
            inset: 0;
            backdrop-filter: blur(.7em);
        }
        .raindrop{
            z-index: -1;
            position: fixed;
            /* width: 1em; */
            /* height: .9em; */
            border-radius: 50%;
            background-image: inherit;
            background-size: 100% 150%;
            background-position: center;
            rotate: 180deg;
            box-shadow:
            inset 0 .3em .3em rgb(255, 255, 255),
                  0 -.1em .2em -.2em rgb(0, 0, 0)
            ;
            /* transition: left .5s ease-out; */
            animation: drop 3s 1s ease-in-out both;
        }
        @keyframes drop {
            0%{
                transform: translateY(0);
            }
            50%{
                transform: translateY(-35vh);
            }
            70%{
                transform: translateY(-45vh);
            }
            100%{
                transform: translateY(-100vh);
            }
        }
        .back-rain{
            z-index: -2;
            position: fixed;
            width: .1em;
            height: 2.7em;
            background-color: rgb(159, 168, 175);
            border-radius: 50%;
            opacity: .6;
            animation: fall 1s ease-in both;
        }
        @keyframes fall {
            0%{
                transform: translateY(0);
            }
            100%{
                transform: translateY(110vh);
            }
        }

        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        main{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 1.05em;
            margin: 0 auto;
            width: 100%;
            max-width: 50rem;
        }
        p{
            margin-bottom: .4em;
        }
        .glass-block{
            background-color: rgba(255, 255, 255, 0.548);
            backdrop-filter: blur(.18em);
            margin: 1em 0;
            padding: 1.2em;
            color: rgb(31, 55, 75);
            border-radius: .35em;
            box-shadow:
            inset 0 .1em .2em -.1em rgba(255, 255, 255, 0.55),
            inset 0 .1em .1em -.1em rgba(255, 255, 255, 0.8),
            inset 0 -.1em .1em -.1em rgba(0, 0, 0, 0.45),
            0 .1em .5em -.2em rgba(0, 0, 0, 0.45);
        }

        /* ===== Кастомный скроллбар ===== */

    /* --- Для WebKit-браузеров (Chrome, Safari, Edge, Opera) --- */

    /* Ширина скроллбара */
    ::-webkit-scrollbar {
        width: 4px;
    }

    /* Фон (трек) скроллбара */
    ::-webkit-scrollbar-track {
        background: rgb(31, 55, 75);
        border-radius: 0px;
    }

    /* Ползунок скроллбара */
    ::-webkit-scrollbar-thumb {
        background: #e4f1f7;
        border-radius: 0px;
        border-left: 2px solid rgb(31, 55, 75);
    }
    </style>
</head>
<body>
    <div class="filler"></div>
    <!-- <span class="back-rain"></span> -->
    <!-- <span class="raindrop"></span> -->
    <main>
        <!-- .glass-block*5>(h3{Section $$}+p*3>lorem14)*3 -->
        <div class="glass-block">
            Здесь идет дождь
        </div> 
    </main>
</body>
<script>
    function rand(min, max){
        return min + Math.random() * (max-min);
    }

    function randomSpawn(element, dx, dy){
        element.style.left = rand(dx[0], dx[1]) + 'vw';
        element.style.top  = rand(dy[0], dy[1]) + 'vh';
    }

    function calcDistance(x1, y1, x2, y2){
        let dx = Math.abs(x2-x1);
        let dy = Math.abs(y2-y1);
        return Math.sqrt( dx*dx + dy*dy );
    }

    function uniteSize(s1, s2){
        function cs(r){
            return Math.PI * r**2;
        }
        function rfroms(s){
            return Math.sqrt(s / Math.PI);
        }
        let s = cs(s1) + cs(s2);
        let ns = rfroms(s);
        return ns;
    }


    // Create on window drops
    setInterval(()=>{
        let drop = document.createElement('span');
        drop.className = 'raindrop'
        randomSpawn(drop, [0, 100], [0, 70]);
        let randomSize = rand(0.6, 1);
        drop.style.width = randomSize + 'em'; 
        drop.style.height = randomSize * 0.9 + 'em'; 
        document.body.insertAdjacentElement("beforeend", drop);
        setTimeout(()=>{
            drop.remove();
        }, 5000)
    }, 200);

    // Create  back drops
    setInterval(()=>{
        let backDrop = document.createElement('span');
        backDrop.className = 'back-rain';
        backDrop.style.opacity = rand(0.2, 0.6)
        randomSpawn(backDrop, [0, 100], [-5, -5]);
        document.body.insertAdjacentElement("beforeend", backDrop);
        setTimeout(()=>{
            backDrop.remove();
        }, 2000)
    }, 10);


    // collapse on window drops
    setInterval(()=>{
        let drops = Array.from(document.body.querySelectorAll('.raindrop'));
        for(let i = 0; i < drops.length; i++){
            let d1b = drops[i].getBoundingClientRect();
            for(let j = 0; j < i; j++){
                let d2b = drops[j].getBoundingClientRect();
                if(calcDistance(d1b.x, d1b.y, d2b.x, d2b.y) < 20){
                    // console.log(((Number(drops[i].style.left.slice(0, -2)) + Number(drops[j].style.left.slice(0, -2)))/2) + 'wv');
                    drops[i].remove();
                    let unitedSize = uniteSize(drops[i].style.width.slice(0, -2), drops[j].style.width.slice(0, -2));
                    drops[j].style.width = unitedSize * 0.9 + 'em'
                    drops[j].style.height = unitedSize * 0.8 + 'em';
                }
            }
        }
    }, 70);


    // parallax
    let nowpos;
    let newpos;
    document.body.style.backgroundPositionX = "0%";
    document.body.onmousemove = (event)=>{
        nowpos = document.body.style.backgroundPositionX.slice(0, -1);
        newpos = (window.innerWidth-event.clientX)/window.innerWidth*100;
    };
    setInterval(()=>{
        nowpos = document.body.style.backgroundPositionX.slice(0, -1);
        document.body.style.backgroundPositionX = Number(nowpos) + Number(newpos - nowpos)*0.05 + '%';
    },1000/60);

    // scroll
    function getScrollPercent() {
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        
        if (docHeight === 0) return 100;
        
        return (scrollTop / docHeight) * 100;
    }
    // window.onscroll = (event)=>{
    //     console.log(getScrollPercent().toFixed(2), '%');
    // }
</script>
</html>
