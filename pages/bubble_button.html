<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body{
            height: 100%;
            padding: 0;
            margin: 0;
        }
        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            background-color: rgb(0, 0, 0);
        }
        .bubble-button-container{
            position: relative;
            --color1: rgb(0, 255, 149);
            --color2: blue;
            --b-radius: 1em;
            --b-width: .2em;
            margin: 1em;
        }
        .bubble-button-container:active>.bubble-button{
            transform: translateY(-0.7em);
            transition: transform 0.13s ease-out;
        }
        .bubble-button{
            display: block;
            position: relative;
            width: max-content;
            border-radius: var(--b-radius);
            margin: calc(var(--b-width));
            padding: 1em 2em;
            line-height: 1em;
            color: white;
            font-size: 20px;
            text-align: center;
            transition: transform 0.23s ease-out;
            z-index: 0;
        }

        .bubble-button::before{
            content: '';
            position: absolute;
            inset: calc(var(--b-width) * -1);
            background-image: linear-gradient(
                -45deg, 
                var(--color2) 25%,
                var(--color1) 25%, 
                var(--color1) 75%,
                var(--color2) 75%
            );
            border-radius: calc(var(--b-radius) + var(--b-width));
            background-size: 200%;
            animation: backMove 8s linear infinite;
            z-index: -2;
        }
        .bubble-button::after{
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-color: rgb(21, 21, 21);
            z-index: -1;
        }
        @keyframes backMove {
            0%{
                background-position: 200% 0;
            }
            100%{
                background-position: 0 0;
            }
        }
        .bubble{
            display: block;
            position: absolute;
            top: calc((100% - 1.2em)/2);
            left: calc((100% - 1.2em)/2);
            transform: translate(-50%, -50%);
            background-color: var(--color1);
            border-radius: 50%;
            width: 1.2em;
            height: 1.2em;
            animation: flyBubble 2s cubic-bezier(0.095, 0.62, 0.165, 0.5) both;
            z-index: -3;
        }
        @keyframes flyBubble {
            0%{
                transform: rotate(var(--rot)) translate(0px);
            }
            100%{
                transform: rotate(var(--rot)) translate(var(--len));
            }
        }
    </style>
</head>
<body>
    <div class="bubble-button-container">
        <div class="bubble-button">Button</div>
    </div>
    <div class="bubble-button-container">
        <div class="bubble-button">Button</div>
    </div>
    <div class="bubble-button-container">
        <div class="bubble-button">Button</div>
    </div>
    <div class="bubble-button-container">
        <div class="bubble-button">Button</div>
    </div>
</body>
<script>
    Array.from(document.querySelectorAll('.bubble-button-container')).forEach(element => {
        eventControll(element);
    });

    function eventControll(eventElement){
        let isActive = false;
        eventElement.onclick = ()=>{
            if(event.target === eventElement || true){ // и тут тоже
                if(!isActive || true){ // убрать '|| true' для работы по наведению
                    isActive = true;
                    createBubbles(eventElement, 24); // .parentElement для активации на кнопке по наведению
                }
            }
        }
        eventElement.onmouseleave = ()=>{
            if(event.target === eventElement){
                isActive = false;
            }
        }
    }

    function test(){
        console.log('it`s test');
    }

    function createBubbles(element, count){
        for(let i = 0; i < count; i++){
            let bubble = document.createElement('span');
            bubble.className = 'bubble';
            var size = 5 + Math.random() * 20;
            bubble.style.cssText += '--rot: ' + Math.round(Math.random() * 360) + 'deg';
            bubble.style.cssText += '--len: ' + Math.round(70 + Math.random() * 100) + 'px';
            bubble.style.cssText += '--siz: ' + Math.round(size) + 'px';
            if(Math.random() > .5){
                bubble.style.backgroundColor = 'var(--color2)';
            }
            setTimeout(()=>{element.append(bubble);}, Math.random() * 40);
            setTimeout(()=>{bubble.remove()},1000 + Math.random() * 1000);
        }
    }
</script>
</html>
