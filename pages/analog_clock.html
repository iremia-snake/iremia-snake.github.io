<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналоговые часы</title>
    <style>
        body{
            background-color: rgb(255, 255, 255);
        }
        .clock{
            --size: 400px;
            position: relative;
            width: var(--size);
            height: var(--size);
            background-color: rgb(241, 241, 241);
            /* background-image: radial-gradient(white 10px, rgb(180, 180, 180) 200px); */
            border-radius: 50%;
            margin: auto;
            box-shadow:
                .1em .4em .8em -.5em rgba(0, 0, 0, 0.5),
                inset .1em .2em .3em rgba(255, 255, 255, 0.5),
                inset -.1em -.2em .3em rgba(0, 0, 0, 0.3);

        }
        .arrow{
            height: var(--width);
            border-radius: var(--width);
            top: calc(50% - var(--width)/2);
            left: calc(50% - var(--width)/2);
            display: block;
            position: absolute;
            transform-origin: calc(var(--width)/2) center;
            transition-delay: 100ms;
            box-shadow: 0 0 5px -1px rgba(0, 0, 0, 0.5);
        }
        .arrow.sec-arrow{
            --width: .15em;
            width: 45%;
            background-color: rgb(255, 75, 75);
            transition-delay: 0;
            transition: rotate .19s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .arrow.minute-arrow{
            background-color: rgb(54, 117, 255);
            width: 40%;
            --width: .2em;
        }
        .arrow.hour-arrow{
            background-color: rgb(54, 117, 255);
            width: 30%;
            --width: .25em;
        }
        .dial{
            position: absolute;
            inset: 0;
            /* background-color: red; */
        }
        .dot{
            display: block;
            position: absolute;
            z-index: 1;
            width: .5em;
            height: .5em;
            background-color: rgb(199, 199, 199);
            top: 50%;
            left: 50%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
             box-shadow:
                0 0 5px -1px rgba(0, 0, 0, 0.5),
                inset .025em .04em .03em rgba(255, 255, 255, 0.5),
                inset -.025em -.04em .03em rgba(0, 0, 0, 0.3);
        }
        .dial span{
            --m: 1;
            position: absolute;
            border-radius: 10px;
            width: calc(1em * var(--m));
            height: .15em;
            background-color: rgba(0, 0, 0, 0.4);
            left: 50%;
            top: 50%;
            transform: translate(-50% ,-50%) rotate(calc(var(--i) * 6deg)) translateX(calc(var(--size)/2 - var(--size)/40 - 50%));
            box-shadow:  inset 0 0 .05em rgba(0, 0, 0, 0.7);
        }
        .none-transition{
            transition: none;
        }

    </style>
</head>
<body>
    <div class="clock">
        <div class="dial"></div>
        <div class="dot"></div>
        <div class="arrow hour-arrow"></div>
        <div class="arrow minute-arrow"></div>
        <div class="arrow sec-arrow"></div>
    </div>
</body>
<script>
    function log(data){
        var d = new Date();
        var h = d.getHours();
        var m = d.getMinutes();
        var s = d.getSeconds();
        var ms = d.getMilliseconds();
        console.log(`${h}:${m}:${s}.${ms}\t${data}`);
    }
    function drawLines(){
        var dial = document.body.querySelector('.clock .dial');
        for(var i = 0; i < 60; i++){
            var m = 0.6;
            if (i % 5 == 0){m = 1.2;}
            if (i % 15 == 0){m = 2.8;}
            dial.insertAdjacentHTML('beforeend', '<span style="--i:' + i + '; --m:' + m +'; "></span>');
        }
    }
    function getSecArrow(){
        return document.body.querySelector('.arrow.sec-arrow');
    }
    function getMinArrow(){
        return document.body.querySelector('.arrow.minute-arrow');
    }
    function getHourArrow(){
        return document.body.querySelector('.arrow.hour-arrow');
    }
    function teleportArrow(arrow){
        var transition = window.getComputedStyle(arrow).transition;
        setTimeout(()=>{arrow.style.transition = 'none';}, 700);    // отключение анимации 
        setTimeout(()=>{arrow.style.rotate = -96 + 'deg';}, 750); // перенос стрелки в отрицательные значения (-1 секундаёё)
        setTimeout(()=>{arrow.style.transition = transition;}, 800);    // возвращение анимации 
    }
    function updateTime(){
        var dateObj = new Date();
        var secArrow = getSecArrow();
        var minuteArrow = getMinArrow();
        var hourArrow = getHourArrow();
        if( dateObj.getSeconds() == 59 ){
            teleportArrow(secArrow);
        }
        secArrow.style.rotate = dateObj.getSeconds() * 6 - 90 + 'deg';
        minuteArrow.style.rotate = (dateObj.getMinutes() + dateObj.getSeconds() / 60)* 6 - 90 + 'deg';
        hourArrow.style.rotate = (dateObj.getHours() + dateObj.getMinutes() / 60) / 12 * 360 - 90 + 'deg';
    }
    drawLines();
    updateTime();
    setInterval(updateTime, 1000);
</script>
</html>
