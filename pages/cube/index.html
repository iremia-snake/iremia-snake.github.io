<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cube.css">
    <link rel="stylesheet" href="style.css">
    <title>Куб</title>
</head>
<body>
    <form action="" id="controls-form">
        <label for="mouse_control">manual rotate</label>
        <input type="checkbox" name="mouse_control">
        <label for="size">size</label>
        <input type="range" name="input_size" min="10" max="1000" value="250">
        <label for="perspective">perspective</label>
        <input type="range" name="input_perspective" min="1" max="500" value="200">
        <label for="border_width">border_width</label>
        <input type="range" name="input_border_width" min="0" max="10" value="2" step="0.1">
        <label for="">opacity</label>
        <input type="range" name="input_opacity" min="0" max="1.01" step="0.01" value="1">
        <div class="right-arrow-block">&#187;</div>
    </form>
    <div class="container" id="cube">
        <div class="back side"></div>
        <div class="left side"></div>
        <div class="right side"></div>
        <div class="top side"></div>
        <div class="bottom side"></div>
        <div class="front side"></div>
      </div>
</body>
<script src="script.js"></script>
</html>
